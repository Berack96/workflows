# Security checks of this repository every Monday on main, for the CVEs found after the merge, and by hand. Not on PRs:
# `fix` would show up there as a skipped check.
name: Security weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

# By ref: a run by hand on another branch does not wait for the one on main.
concurrency:
  group: security-weekly-${{ github.ref }}

jobs:
  security:
    name: Security
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/security.yml

  # Only on the default branch: a draft PR with the updates of the vulnerable packages, or the report of the failure.
  fix:
    name: Fix
    needs: security
    if: failure() && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/security-fix.yml
