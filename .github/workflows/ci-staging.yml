# Push on main: staging tag and pre-release of this repository.
name: Staging

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions: {}

jobs:
  release:
    name: Pre-release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      mode: staging
