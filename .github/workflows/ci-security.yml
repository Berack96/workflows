# Security checks of this repository: on every PR and every Monday on main, for the CVEs found after the merge; by hand
# on any branch.
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

# A new commit on the PR cancels the previous run.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/security.yml

  # Not on PRs: a draft PR with the updates of the vulnerable packages, or the report of the failure, on top of the
  # branch of the run.
  fix:
    name: Fix
    needs: security
    if: failure() && github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/security-fix.yml
