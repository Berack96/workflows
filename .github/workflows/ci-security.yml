# Security checks of this repository on every PR. The weekly ones with the fixes, also by hand on any branch, are in
# `ci-security-weekly.yml`.
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# A new commit on the PR cancels the previous run.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/security.yml
