# Deploy of a commit to a GitHub environment: the commands come from the caller, the job checks out the commit, prepares
# the tools and runs them, one deploy at a time per environment.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment of the deploy (`production`), with its protection rules and history
        type: string
        required: true
      ref:
        description: Commit or tag to deploy, e.g. the `sha` output of `release.yml` (empty for the commit of the run)
        type: string
        default: ""
      run:
        description: Commands of the deploy (bash, one per line)
        type: string
        required: true
      runs-on:
        description: Runner of the job, a label (`self-hosted`) or a JSON list of labels
        type: string
        default: ubuntu-latest
      env:
        description: Environment variables for the whole job, one `NAME=value` per line
        type: string
        default: ""
      mise:
        description: Install the tools of the repository's mise config
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    environment: ${{ inputs.environment }}
    # A deploy waits for the one in progress on the same environment, never cancels it.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Before mise: variables like `MISE_DISABLE_TOOLS` must already be there.
      - if: inputs.env
        env:
          VARS: ${{ inputs.env }}
        run: printf '%s\n' "$VARS" >> "$GITHUB_ENV"
      # mise pinned: version and sha256 of the linux-x64 binary (not of the archive).
      - if: inputs.mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.9
          sha256: ${{ runner.os == 'Linux' && runner.arch == 'X64' && '6ab6646b52b83f6bbd51c9d0d3ae54264ffa90efd1ac6d7c0ec5a86bbc6a0030' || '' }}
      # shortcut: no secrets for the commands, they read them from the runner; add them when a deploy needs GitHub's.
      - name: Run
        env:
          RUN: ${{ inputs.run }}
        run: bash -eo pipefail -c "$RUN"
