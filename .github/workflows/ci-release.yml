# By hand: release `vX.Y.Z` of a preview tag of this repository, then the preview tags before it are deleted.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag to release (empty for the latest)
        required: false

permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      from: v{YYYY}.{MM}-preview.{NNN}
      from-tag: ${{ inputs.tag }}
      from-workflow: ci-preview.yml
      prune: true
