# Push on main: preview tag `vYYYY.MM-preview.NNN` and pre-release of this repository.
name: Preview

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"

permissions: {}

jobs:
  release:
    name: Pre-release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: v{YYYY}.{MM}-preview.{NNN}
      release-tag: v{X}.{Y}.{Z}
      github-release: prerelease
      prune-keep: 3
