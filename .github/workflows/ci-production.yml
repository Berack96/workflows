# By hand: release `vX.Y.Z` of a release candidate of this repository.
name: Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate to release (empty for the latest)
        required: false

permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      from: v{X}.{Y}.{Z}-rc.{N}
      from-tag: ${{ inputs.tag }}
      from-workflow: ci-staging.yml
