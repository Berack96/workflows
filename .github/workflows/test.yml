# Lint and tests: the commands come from the caller, the job only prepares the tools and the cache.
name: Test

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner of the job, a label (`windows-latest`, `self-hosted`) or a JSON list of labels
        type: string
        default: ubuntu-latest
      services:
        description: Service containers of the job, as the JSON of `jobs.<id>.services` (e.g. a database)
        type: string
        default: "{}"
      pre-run:
        description: Commands that prepare the tests, before `run` (bash, one per line)
        type: string
        default: ""
      run:
        description: Commands that run lint and tests (bash, one per line)
        type: string
        required: true
      env:
        description: Environment variables for the whole job, one `NAME=value` per line
        type: string
        default: ""
      mise:
        description: Install the tools of the repository's mise config
        type: boolean
        default: false
      mise-version:
        description: Mise version used to run repository tools
        type: string
        default: "2026.11.3"
      cache:
        description: Paths to keep between runs, one per line (empty for no cache)
        type: string
        default: ""
      cache-key:
        description: Glob of the files whose hash is the key of the cache, e.g. `**/Cargo.lock` (empty for a new cache each run)
        type: string
        default: ""
      artifact:
        description: Name of an artifact to upload after the tests, for the next jobs (empty for none)
        type: string
        default: ""
      artifact-path:
        description: Files of the artifact
        type: string
        default: ""

permissions: {}

jobs:
  test:
    name: Checks
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    services: ${{ fromJSON(inputs.services) }}
    permissions:
      contents: read
    # Bash also on Windows, where the default is PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before mise: variables like `MISE_DISABLE_TOOLS` must already be there.
      - if: inputs.env
        env:
          VARS: ${{ inputs.env }}
        run: printf '%s\n' "$VARS" >> "$GITHUB_ENV"
      # mise pinned by the caller's version.
      - if: inputs.mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ inputs.mise-version }}
      # A cache with the key never changes: without `cache-key` each run saves a new one and restores the latest.
      - if: inputs.cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache }}
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key && hashFiles(inputs.cache-key) || github.sha }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-
      - name: Pre-run
        if: inputs.pre-run
        env:
          RUN: ${{ inputs.pre-run }}
        run: bash -eo pipefail -c "$RUN"
      - name: Run
        env:
          RUN: ${{ inputs.run }}
        run: bash -eo pipefail -c "$RUN"
      - if: inputs.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}
          retention-days: 1
